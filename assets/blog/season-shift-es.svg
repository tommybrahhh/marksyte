<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">De un pico de verano a una temporada distribuida</title><desc id="desc">Comparación visual entre el calendario turístico tradicional y un nuevo patrón de demanda más largo y variable.</desc>
<rect width="1200" height="560" rx="32" fill="#ffffff"/>
<text x="70" y="82" font-family="Arial" font-size="36" font-weight="700" fill="#172026">La demanda ya no sigue un único pico</text>
<text x="70" y="122" font-family="Arial" font-size="21" fill="#5f6b72">El calor, el precio y la saturación amplían la temporada y cambian el mix por ruta.</text>
<g font-family="Arial" font-size="19" fill="#5f6b72" text-anchor="middle"><text x="280" y="500">ABR</text><text x="400" y="500">MAY</text><text x="520" y="500">JUN</text><text x="640" y="500">JUL</text><text x="760" y="500">AGO</text><text x="880" y="500">SEP</text><text x="1000" y="500">OCT</text></g>
<text x="70" y="230" font-family="Arial" font-size="22" font-weight="700" fill="#172026">Modelo tradicional</text>
<path d="M280 400 C430 395 500 350 600 220 C650 155 735 155 790 230 C875 345 925 390 1000 400" fill="none" stroke="#a9b4b2" stroke-width="24" stroke-linecap="round"/>
<text x="70" y="350" font-family="Arial" font-size="22" font-weight="700" fill="#172026">Nuevo patrón</text>
<path d="M280 435 C390 410 470 340 540 300 C620 255 685 285 745 310 C820 342 875 360 1000 380" fill="none" stroke="#0d6b5f" stroke-width="24" stroke-linecap="round"/>
<g fill="#fff4df" stroke="#172026" stroke-width="3"><circle cx="430" cy="374" r="24"/><circle cx="690" cy="292" r="24"/><circle cx="900" cy="362" r="24"/></g>
<g font-family="Arial" font-size="15" font-weight="700" fill="#172026" text-anchor="middle"><text x="430" y="379">CLIMA</text><text x="690" y="297">RUTA</text><text x="900" y="367">VALOR</text></g>
</svg>