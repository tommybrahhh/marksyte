    <circle cx="654" cy="470" r="13"/>
    <circle cx="934" cy="382" r="13"/>
  </g>

  <g transform="translate(705 126)" filter="url(#softShadow)">
    <rect width="210" height="112" rx="18" fill="#ffffff" opacity=".98"/>
    <g transform="translate(34 28)" fill="none" stroke="#0d6b5f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 62h132"/>
      <path d="M32 62V28h104v34"/>
      <path d="M52 28V12h64v16"/>
      <path d="M50 82h68"/>
    </g>
  </g>

  <g transform="translate(826 612)" filter="url(#softShadow)">
    <rect width="250" height="142" rx="18" fill="#ffffff" opacity=".98"/>
    <path d="M58 52h124l-12 60H70z" fill="#fff4df" stroke="#173f3a" stroke-width="6"/>
    <path d="M88 54c0-28 58-28 58 0" fill="none" stroke="#173f3a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="92" cy="86" r="7" fill="#0d6b5f"/>
    <circle cx="148" cy="86" r="7" fill="#0d6b5f"/>
    <text x="125" y="128" fill="#5f6b72" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">TRAVEL RETAIL</text>
  </g>

  <g transform="translate(128 700)">
    <rect width="520" height="96" rx="18" fill="#ffffff" opacity=".92"/>
    <g font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">
      <text x="58" y="61" fill="#173f3a" font-size="22">APR</text>
      <text x="192" y="61" fill="#173f3a" font-size="22">JUN</text>
      <text x="326" y="61" fill="#173f3a" font-size="22">AUG</text>
      <text x="462" y="61" fill="#173f3a" font-size="22">OCT</text>
    </g>
    <path d="M52 36C142 30 210 52 270 44C346 34 410 28 468 34" fill="none" stroke="#0d6b5f" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
