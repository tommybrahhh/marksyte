<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">European traveller decision model</title>
  <desc id="desc">An editorial illustration showing safety, value and access signals shaping a travel retail decision.</desc>
  <rect width="1200" height="900" fill="#f6f3ed"/>
  <rect x="96" y="88" width="1008" height="724" rx="28" fill="#ffffff" stroke="#18222f" stroke-width="3"/>
  <path d="M190 650c150-130 288-182 414-156 126 25 238-7 336-96" fill="none" stroke="#2b8c83" stroke-width="18" stroke-linecap="round"/>
  <path d="M206 656c102-23 188-26 260-8 72 19 151 17 236-4 85-21 183-72 294-154" fill="none" stroke="#f0a33a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="314" cy="602" r="74" fill="#dff0ea" stroke="#18222f" stroke-width="3"/>
  <circle cx="608" cy="512" r="86" fill="#fff0c7" stroke="#18222f" stroke-width="3"/>
  <circle cx="884" cy="406" r="74" fill="#e3e8f4" stroke="#18222f" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#18222f">
    <text x="314" y="590" font-size="30" font-weight="700" text-anchor="middle">Safety</text>
    <text x="314" y="626" font-size="20" text-anchor="middle">confidence</text>
    <text x="608" y="500" font-size="32" font-weight="700" text-anchor="middle">Value</text>
    <text x="608" y="538" font-size="20" text-anchor="middle">total trip cost</text>
    <text x="884" y="394" font-size="30" font-weight="700" text-anchor="middle">Access</text>
    <text x="884" y="430" font-size="20" text-anchor="middle">direct routes</text>
    <text x="144" y="178" font-size="54" font-weight="700">Traveller filters are changing</text>
    <text x="144" y="228" font-size="25">Retail performance depends on route, moment and confidence.</text>
  </g>
  <g fill="#18222f">
    <path d="M980 245l72 38-72 38z"/>
    <rect x="900" y="272" width="96" height="22" rx="11"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#18222f">
    <text x="180" y="744">Route</text>
    <text x="410" y="744">Budget</text>
    <text x="650" y="744">Weather</text>
    <text x="880" y="744">Assortment</text>
  </g>
</svg>
